[build]
  command = "pnpm run build"
  publish = "dist"

# Security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# List and table view fragments: fetched by the page, never indexed.
[[headers]]
  for = "/vistas/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Alias domains redirect to the primary domain.
[[redirects]]
  from = "https://vazajato.com/*"
  to = "https://www.vazajato.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.vazajato.com/*"
  to = "https://www.vazajato.me/:splat"
  status = 301
  force = true
